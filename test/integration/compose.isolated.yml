# Isolated runner for upstream integration tests. See docs/testing/baseline-upstream-tests.md.
# All services share the network namespace of `netns`, so the tests' hardcoded
# localhost:<port> addresses reach these containers. No host ports are published.
name: cedrazeka-it
services:
  netns:
    image: alpine:3.24
    command: ["sleep", "infinity"]
  redis:
    image: redis:7-alpine
    network_mode: service:netns
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    network_mode: service:netns
  postgres:
    image: postgres:16
    network_mode: service:netns
    environment: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test}
    command: ["postgres","-c","wal_level=logical","-c","max_wal_senders=4","-c","wal_writer_delay=10ms","-c","max_connections=500","-c","fsync=off","-c","synchronous_commit=off","-c","full_page_writes=off"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U test -d test"], interval: 5s, timeout: 5s, retries: 10}
  google-pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:572.0.0-emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    network_mode: service:netns
  aws-localstack:
    image: localstack/localstack:4.14
    network_mode: service:netns
    environment: [SERVICES=sqs,sns, DEFAULT_REGION=us-east-1, DATA_DIR=/tmp/localstack/data]
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    network_mode: service:netns
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: centrifugo-kafka
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  tests:
    image: golang:1.27.4-bookworm
    network_mode: service:netns
    profiles: ["tests"]
    working_dir: /src
    environment: {GOMODCACHE: /hostmod, GOPROXY: "off"}
    volumes:
      - ${REPO}:/src
      - ${HOSTMOD}:/hostmod:ro
      - gocache:/root/.cache/go-build
volumes: {gocache: {}}
