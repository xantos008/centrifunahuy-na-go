# Local Microsoft emulators. Run through azure.sh with explicit license acceptance.
networks:
  ref-net: {}
  sut-net: {}

x-env: &env
  ACCEPT_EULA: ${ACCEPT_EULA:?Supply acceptance of both Microsoft EULAs}
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Supply an ephemeral SQL password}

x-sql: &sql
  profiles: [azure]
  platform: linux/amd64
  image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
  environment:
    <<: *env
    MSSQL_PID: Developer
    MSSQL_MEMORY_LIMIT_MB: 2048
  healthcheck:
    test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' -b -o /dev/null"]
    interval: 3s
    timeout: 5s
    retries: 50

x-bus: &bus
  profiles: [azure]
  image: mcr.microsoft.com/azure-messaging/servicebus-emulator@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
  ports: ["127.0.0.1::5672", "127.0.0.1::5300"]
  environment:
    <<: *env
    SQL_SERVER: mssql
    EMULATOR_HTTP_PORT: 5300

services:
  mssql-ref:
    <<: *sql
    networks: {ref-net: {aliases: [mssql]}}
  mssql-sut:
    <<: *sql
    networks: {sut-net: {aliases: [mssql]}}
  servicebus-ref:
    <<: *bus
    networks: {ref-net: {aliases: [servicebus]}}
    volumes: ["${COMPAT_AZURE_DIR:?}/ref.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"]
    depends_on: {mssql-ref: {condition: service_healthy}}
  servicebus-sut:
    <<: *bus
    networks: {sut-net: {aliases: [servicebus]}}
    volumes: ["${COMPAT_AZURE_DIR:?}/sut.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"]
    depends_on: {mssql-sut: {condition: service_healthy}}
  ref:
    profiles: [azure]
    image: centrifugo/centrifugo:v6.10.3@sha256:33fdbbce7d195dde316cbde17bc1d2a17b9e345de82799d1ec3c2bb8916e3803
    command: ["centrifugo", "-c", "/etc/compat/config.json"]
    volumes: ["./configs/azure/config.json:/etc/compat/config.json:ro"]
    ports: ["127.0.0.1::8000"]
    networks: [ref-net]
  sut:
    profiles: [azure]
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: ["/opt/cedrazeka", "--compat=centrifugo", "-c", "/etc/compat/config.json"]
    volumes:
      - "./configs/azure/config.json:/etc/compat/config.json:ro"
      - "${COMPAT_AZURE_DIR:?}/cedrazeka:/opt/cedrazeka:ro"
    ports: ["127.0.0.1::8000"]
    networks: [sut-net]
