# Modified by the Cedrazeka authors, 2026. See NOTICE.
# Phase 1, step 1.9: actions pinned by commit SHA, project-local tools via
# Makefile (docs/ai/tooling-lock.md), compatibility suite job (ADR-0028).
name: test
on:
  push:
    tags-ignore:
      - '**'
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: 1.27.4
jobs:
  checks:
    name: Lint, vulnerabilities, licenses
    runs-on: ubuntu-latest
    # Prevent duplicate builds on internal PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `make lint` diffs against the upstream import commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ runner.os }}-go-checks-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-checks-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-checks-
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./... && (cd test/compat && go vet ./...)
      - name: golangci-lint (project-local, tools/go.mod)
        run: make lint
      - name: govulncheck
        run: make vuln
      - name: THIRD_PARTY_LICENSES up to date
        run: make licenses-check

  test:
    name: Test with Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        go-version: [1.27.4]
    env:
      # Race-enabled test binaries sleep 1s at exit waiting for late race
      # reports by default; races during tests still fail them.
      GORACE: atexit_sleep_ms=0
    steps:
      # Integration test binaries and service images need more disk space than
      # the runner has free. Remove large preinstalled toolchains which are not
      # used here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start services in background
        # Pull images and start containers while tests compile and unit tests
        # run, see "Wait for services" below.
        run: |
          { docker compose up -d > "$RUNNER_TEMP/compose-up.log" 2>&1; echo $? > "$RUNNER_TEMP/compose-up.exit"; } &

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ runner.os }}-go-test-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-test-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-test-${{ matrix.go-version }}-

      - name: List packages
        id: packages
        # Unit packages run without services, integration ones need them.
        run: |
          echo "unit=$(bash misc/scripts/test_packages.sh unit | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "integration=$(bash misc/scripts/test_packages.sh integration | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Build integration tests
        # Compile before services are needed (-exec skips running).
        run: go test -count=1 -cover -race --tags=integration -run '^$' -exec /bin/true ${{ steps.packages.outputs.integration }} > /dev/null

      - name: Unit tests
        run: make test TEST_PACKAGES="${{ steps.packages.outputs.unit }}"

      - name: Wait for services
        run: |
          for _ in $(seq 900); do [ -f "$RUNNER_TEMP/compose-up.exit" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/compose-up.log"
          docker compose up -d --wait

      - name: Integration tests
        run: make test-integration TEST_PACKAGES="${{ steps.packages.outputs.integration }}"

  compat:
    name: Compatibility suite (ref centrifugo v6.10.3 vs sut)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - name: Start ref and sut
        run: make compat-up
      - name: Diff mode (ref vs sut)
        run: make compat
      - name: Golden mode (sut vs recorded ref)
        run: make compat-golden
      - name: Server logs on failure
        if: failure()
        run: cd test/compat && docker compose logs --no-color
      - name: Stop
        if: always()
        run: make compat-down
