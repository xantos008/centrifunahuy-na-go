# Modified by the Cedrazeka authors, 2026. See NOTICE.
# Actions pinned by commit SHA (phase 1, step 1.9). Note: misc/snapshot does not
# build at upstream v6.10.3 (docs/testing/baseline-upstream-tests.md).
name: snapshot
# Compares what clients, backends and operators observe between the pull
# request's base and head (misc/snapshot). Runs on pull requests labeled
# "snapshot" – refactorings that must not change behavior.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  snapshot:
    name: Before/after snapshot
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'snapshot')
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tool tests
        run: make snapshot-test
      - name: Snapshot diff
        run: make snapshot-diff BASE=origin/${{ github.base_ref }} SNAPSHOT_FLAGS="-with redis,postgres"
